manifestVersion: "2.0"
id: moritz-fr24
category: networking
name: FR24 Feeder
icon: https://raw.githubusercontent.com/MoritzRindt/umbrel-apps/main/moritz-fr24/icon.svg
version: "0.1.0"
tagline: Your own ADS-B receiver, feeding Flightradar24
description: >-
  Connect your Nooelec NESDR receiver and enter your existing Flightradar24 sharing key
  in the protected setup page. Decoder and feeder run separately. No router port
  forwarding is needed, and no media folders are accessed.


  After connecting or reconnecting the USB receiver, restart this app from Umbrel.
  This is a community integration, not an official Flightradar24 app.
